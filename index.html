<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타임슬립 탐험대 - 초경량 압축 버전</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; background: #f4f4f9; }
        #map { width: 100%; height: 100vh; }
        
        /* 상단 UI 패널 */
        .top-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 10px 18px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 1000; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 12px;
        }
        .resource-badge { color: #ff5722; }
        .step-badge { color: #4caf50; }
        .action-btn { background: #3f51b5; color: white; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 11px; }
        .admin-btn { background: #e91e63; color: white; display: none; }

        /* 하단 가이드 배너 */
        .guide-banner {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px; border-radius: 20px;
            z-index: 1000; font-size: 13px; text-align: center; max-width: 90%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 팝업 모달 스타일 */
        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999; text-align: center; width: 85%; max-width: 380px; box-sizing: border-box;
        }
        .modal h3 { margin-top: 0; color: #333; }
        .btn {
            background: #ff5722; color: white; border: none; padding: 12px 20px;
            border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 14px;
        }
        .btn-secondary { background: #ccc; color: #333; }
        .btn-danger { background: #f44336; color: white; padding: 4px 8px; font-size: 10px; margin-top: 0; width: auto; }
        .btn-edit { background: #ff9800; color: white; padding: 4px 8px; font-size: 10px; margin-top: 0; width: auto; }

        .form-input {
            width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 13px;
        }

        #scratch-box {
            width: 100%; height: 150px; background: #ddd; border-radius: 10px;
            position: relative; overflow: hidden; margin: 15px 0; display: flex; align-items: center; justify-content: center;
        }
        #scratch-box img { width: 100%; height: 100%; object-fit: cover; filter: blur(5px); transition: 0.5s; }
        .scratch-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #888;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer;
        }

        .scroll-list { max-height: 150px; overflow-y: auto; text-align: left; margin-top: 8px; display: none; border: 1px solid #eee; padding: 5px; border-radius: 6px; }
        .list-item { display: flex; gap: 8px; margin-bottom: 6px; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; align-items: center; justify-content: space-between; }
        .list-item img { width: 35px; height: 35px; border-radius: 4px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- 상단 상태바 -->
    <div class="top-panel">
        <span>🎞️ <span id="film-count" class="resource-badge">15</span></span>
        <span>👣 <span id="step-count" class="step-badge">0</span></span>
        <button class="action-btn" onclick="openAlbum()">사진첩</button>
        <button id="admin-mode-btn" class="action-btn admin-btn" onclick="openAdminModal()">관리자 모드</button>
    </div>

    <!-- 하단 가이드 배너 -->
    <div id="guide-banner" class="guide-banner">
        GPS 위치를 탐색 중입니다...
    </div>

    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 1. 타임캡슐 발견 팝업 -->
    <div id="discovery-modal" class="modal">
        <h3 id="discovery-title">⏳ 타임캡슐 발견!</h3>
        <p id="discovery-desc">추억의 옛 풍경이 담긴 타임캡슐입니다.</p>
        <p style="font-size: 13px; color: #666;">필요 자원: 빛바랜 필름 10개</p>
        <button class="btn" onclick="startMission()">필름 10개 소모하고 개봉하기</button>
        <button class="btn btn-secondary" onclick="closeModal('discovery-modal')">나중에 하기</button>
    </div>

    <!-- 2. 미니게임 (먼지 닦기) 팝업 -->
    <div id="mission-modal" class="modal">
        <h3>🧹 사진 복원 미니게임</h3>
        <p style="font-size: 13px; color: #666;">화면을 문질러 세월의 먼지를 닦아내세요!</p>
        <div id="scratch-box" ontouchmove="wipeDust()" onclick="wipeDust()">
            <img src="" id="target-photo" alt="옛 사진">
            <div id="overlay-text" class="scratch-overlay">여기를 터치해 먼지 닦기!</div>
        </div>
        <button id="complete-btn" class="btn btn-secondary" disabled onclick="savePhoto()">사진첩에 저장하기</button>
    </div>

    <!-- 3. 내 사진첩 (도감) 모달 -->
    <div id="album-modal" class="modal">
        <h3>📖 나의 타임슬립 앨범</h3>
        <div id="album-list" style="max-height: 35vh; overflow-y: auto; text-align: left; margin-bottom: 10px;"></div>
        <button class="btn btn-secondary" onclick="closeModal('album-modal')">닫기</button>
    </div>

    <!-- 4. 관리자 모드 모달 -->
    <div id="admin-modal" class="modal" style="max-width: 380px;">
        <h3 id="admin-modal-title">🛠️ 타임캡슐 관리자 모드</h3>
        
        <input type="hidden" id="edit-capsule-id" value="">

        <input type="text" id="admin-title" class="form-input" placeholder="타임캡슐 제목 (예: 양평 옛 다리)">
        
        <div style="background: #fdfdfd; padding: 6px; border-radius: 8px; margin: 4px 0; border: 1px solid #ddd; text-align: left;">
            <label style="font-size: 11px; font-weight: bold; color: #333;">📸 사진 선택 (폰 갤러리)</label>
            <input type="file" id="admin-file" accept="image/*" class="form-input" style="margin-top: 2px; font-size: 11px; padding: 4px;">
            <div style="font-size: 10px; color: #666; margin: 2px 0; text-align: center;">--- 또는 이미지 URL (추천) ---</div>
            <input type="text" id="admin-url" class="form-input" placeholder="https:// 이미지 주소 입력" style="margin-bottom: 2px; padding: 6px;">
        </div>

        <input type="text" id="admin-desc" class="form-input" placeholder="상세 설명">
        
        <div style="background: #f9f9f9; padding: 6px; border-radius: 8px; margin: 4px 0; border: 1px dashed #ccc;">
            <div id="selected-coords-text" style="font-size: 11px; color: #c2185b; font-weight: bold; margin-bottom: 4px;">선택된 위치: 미지정 (아래 버튼을 누르세요)</div>
            <button class="btn" style="background: #3f51b5; margin-top: 0; padding: 6px; font-size: 12px;" onclick="startPickingLocation()">📍 지도에서 위치 직접 찍기</button>
        </div>

        <button id="admin-submit-btn" class="btn" style="background:#4caf50; margin-top: 6px; padding: 10px;" onclick="processAndSaveCapsule()">✨ 타임캡슐 등록하기</button>
        <button id="admin-cancel-edit-btn" class="btn btn-secondary" style="display:none; margin-top: 4px; padding: 6px;" onclick="resetAdminForm()">수정 취소</button>
        
        <div style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 6px; text-align: left;">
            <div onclick="toggleAdminList()" style="font-size: 12px; font-weight: bold; color: #3f51b5; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                <span>📂 등록된 캡슐 목록 보기 (수정/삭제)</span>
                <span id="list-toggle-icon">▼</span>
            </div>
            <div id="admin-capsule-list" class="scroll-list"></div>
        </div>

        <button class="btn btn-secondary" onclick="closeModal('admin-modal')" style="margin-top: 8px; padding: 8px;">닫기</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') {
                document.getElementById('admin-mode-btn').style.display = 'inline-block';
            }
        });

        var map = L.map('map').setView([37.5665, 126.9780], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var userMarker = null;
        var capsuleMarkers = {};
        var dustMarkers = [];
        var tempPickMarker = null;
        
        let currentLat = 37.5665;
        let currentLon = 126.9780;
        let activeCapsule = null;
        let pickedLat = null;
        let pickedLon = null;
        let isPickingMode = false;

        let totalSteps = 0;
        let accumulatedMeters = 0;
        let userFilms = 15;
        let isFirstGPS = true;

        const defaultCapsules = [
            {
                id: "capsule_default_1",
                title: "1980년대 광명시장 전경",
                lat: 37.4784,
                lon: 126.8646,
                url: "https://images.unsplash.com/photo-1517732306149-e8f829eb588a?w=400",
                desc: "활기 넘쳤던 옛 광명시장 입구의 풍경입니다."
            }
        ];

        function getCapsules() {
            let saved = localStorage.getItem('gwangmyeong_capsules');
            if (!saved) {
                localStorage.setItem('gwangmyeong_capsules', JSON.stringify(defaultCapsules));
                return defaultCapsules;
            }
            return JSON.parse(saved);
        }

        function getAlbum() {
            return JSON.parse(localStorage.getItem('gwangmyeong_album') || '[]');
        }

        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            var R = 6371000;
            var dLat = (lat2 - lat1) * (Math.PI / 180);
            var dLon = (lon2 - lon1) * (Math.PI / 180);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function renderCapsuleMarkers() {
            for (let id in capsuleMarkers) {
                map.removeLayer(capsuleMarkers[id]);
            }
            capsuleMarkers = {};

            let capsules = getCapsules();
            let album = getAlbum();

            capsules.forEach(cap => {
                let collected = album.some(item => item.id === cap.id);
                
                let capsuleBg = collected ? 'linear-gradient(135deg, #ffd700, #ff8f00)' : 'linear-gradient(135deg, #9c27b0, #673ab7)';
                let capsuleShadow = collected ? 'rgba(255,215,0,0.9)' : 'rgba(156,39,176,0.9)';
                let capsuleText = collected ? '🏆' : '⏳';

                let capsuleIcon = L.divIcon({
                    className: 'custom-arch-capsule',
                    html: `<div style="width:22px; height:28px; background:${capsuleBg}; border-radius: 12px 12px 3px 3px; border:2px solid white; box-shadow:0 0 8px ${capsuleShadow}; display:flex; align-items:center; justify-content:center; color:white; font-size:12px; font-weight:bold;">${capsuleText}</div>`,
                    iconSize: [22, 28],
                    iconAnchor: [11, 28]
                });

                let marker = L.marker([cap.lat, cap.lon], {icon: capsuleIcon}).addTo(map);
                marker.bindPopup(`<b>${cap.title}</b><br>${collected ? '수집 완료됨 (황금빛 액자)' : '미발견 타임캡슐 (보라색 아치)'}`);
                
                capsuleMarkers[cap.id] = { marker: marker, data: cap, collected: collected };
            });
        }

        function spawnDustObjects(centerLat, centerLon) {
            let offsets = [
                {dLat: 0.0003, dLon: 0.0003},
                {dLat: -0.0003, dLon: 0.0004},
                {dLat: 0.0004, dLon: -0.0003}
            ];

            offsets.forEach((offset) => {
                let dLat = centerLat + offset.dLat;
                let dLon = centerLon + offset.dLon;

                let filmIcon = L.divIcon({
                    className: 'custom-film',
                    html: '<div style="background:#1e88e5; width:11px; height:7px; border-radius:1.5px; border:1px solid white; box-shadow:0 0 3px rgba(30,136,229,0.8); display:flex; align-items:center; justify-content:center; font-size:4px;">🎞️</div>',
                    iconSize: [11, 7],
                    iconAnchor: [5.5, 3.5]
                });

                let marker = L.marker([dLat, dLon], {icon: filmIcon}).addTo(map);
                marker.bindPopup("<b>🎞️ 푸른 필름 조각</b><br>터치해서 필름을 수집하세요!");
                
                marker.on('click', function() {
                    let dist = getDistanceFromLatLonInMeters(currentLat, currentLon, dLat, dLon);
                    if (dist <= 30) {
                        userFilms += 2;
                        document.getElementById('film-count').innerText = userFilms;
                        alert("🎞️ 필름 조각을 수집했습니다! (빛바랜 필름 +2 획득)");
                        map.removeLayer(marker);
                    } else {
                        alert("너무 멀리 있습니다! 필름 조각 가까이 다가가세요. (30m 이내)");
                    }
                });

                dustMarkers.push(marker);
            });
        }

        let lastLat = null;
        let lastLon = null;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;

                    if (isFirstGPS) {
                        isFirstGPS = false;
                        
                        let userIcon = L.divIcon({
                            className: 'custom-user',
                            html: '<div style="background:#00c853; width:15px; height:15px; border-radius:50%; border:2px solid white; box-shadow:0 0 6px rgba(0,200,83,0.8);"></div>',
                            iconSize: [15, 15],
                            iconAnchor: [7.5, 7.5]
                        });

                        userMarker = L.marker([currentLat, currentLon], {icon: userIcon}).addTo(map).bindPopup("<b>내 위치</b>");
                        map.setView([currentLat, currentLon], 16);

                        renderCapsuleMarkers();
                        spawnDustObjects(currentLat, currentLon);

                        lastLat = currentLat;
                        lastLon = currentLon;
                    } else {
                        let movedMeters = getDistanceFromLatLonInMeters(lastLat, lastLon, currentLat, currentLon);
                        if (movedMeters > 2) {
                            accumulatedMeters += movedMeters;
                            lastLat = currentLat;
                            lastLon = currentLon;

                            let newSteps = Math.floor(accumulatedMeters / 0.7);
                            if (newSteps > totalSteps) {
                                totalSteps = newSteps;
                                document.getElementById('step-count').innerText = totalSteps;

                                if (totalSteps % 1000 === 0) {
                                    userFilms += 1;
                                    document.getElementById('film-count').innerText = userFilms;
                                    alert("👣 1000걸음 달성! 보상으로 필름 1개가 충전되었습니다!");
                                }
                            }
                        }
                    }

                    userMarker.setLatLng([currentLat, currentLon]);

                    let capsules = getCapsules();
                    let album = getAlbum();
                    let nearestCapsule = null;
                    let minDistance = 999999;

                    capsules.forEach(cap => {
                        let dist = getDistanceFromLatLonInMeters(currentLat, currentLon, cap.lat, cap.lon);
                        if (dist < minDistance) {
                            minDistance = dist;
                            nearestCapsule = cap;
                        }
                    });

                    let banner = document.getElementById('guide-banner');
                    if (nearestCapsule) {
                        let isCollected = album.some(item => item.id === nearestCapsule.id);
                        if (minDistance <= 10 && !isCollected) {
                            banner.innerText = `🎯 [${nearestCapsule.title}] 발견 지점 도달!`;
                            if (!activeCapsule || activeCapsule.id !== nearestCapsule.id) {
                                activeCapsule = nearestCapsule;
                                document.getElementById('discovery-title').innerText = `⏳ ${nearestCapsule.title}`;
                                document.getElementById('discovery-desc').innerText = nearestCapsule.desc;
                                document.getElementById('discovery-modal').style.display = 'block';
                            }
                        } else if (minDistance <= 50) {
                            banner.innerText = `✨ 근처에 타임캡슐(${nearestCapsule.title})이 있습니다! (${Math.round(minDistance)}m)`;
                        } else {
                            banner.innerText = `가장 가까운 타임캡슐까지 거리: 약 ${Math.round(minDistance)}m`;
                        }
                    }
                },
                function(error) { 
                    console.error("GPS 오류", error);
                    document.getElementById('guide-banner').innerText = "⚠️ GPS 위치를 가져올 수 없습니다.";
                },
                { enableHighAccuracy: true }
            );
        }

        map.on('click', function(e) {
            if (isPickingMode) {
                pickedLat = e.latlng.lat;
                pickedLon = e.latlng.lng;

                if (tempPickMarker) {
                    map.removeLayer(tempPickMarker);
                }
                let pickIcon = L.divIcon({
                    className: 'custom-pick',
                    html: '<div style="background:#ff5722; width:30px; height:30px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(255,87,34,0.9); display:flex; align-items:center; justify-content:center; color:white; font-size:14px; font-weight:bold;">📍</div>',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });
                tempPickMarker = L.marker([pickedLat, pickedLon], {icon: pickIcon}).addTo(map);

                document.getElementById('selected-coords-text').innerText = `선택된 위치: 위도 ${pickedLat.toFixed(4)}, 경도 ${pickedLon.toFixed(4)}`;
                isPickingMode = false;
                document.getElementById('admin-modal').style.display = 'block';
                alert("📍 위치가 지정되었습니다!");
            }
        });

        function startPickingLocation() {
            isPickingMode = true;
            document.getElementById('admin-modal').style.display = 'none';
            alert("🗺️ 지도를 터치하여 타임캡슐을 배치할 장소를 선택해주세요!");
        }

        function startMission() {
            if (userFilms < 10) {
                alert("빛바랜 필름이 부족합니다! (필요: 10개)");
                return;
            }
            userFilms -= 10;
            document.getElementById('film-count').innerText = userFilms;
            
            closeModal('discovery-modal');
            
            document.getElementById('target-photo').src = activeCapsule.url;
            document.getElementById('target-photo').style.filter = 'blur(5px)';
            document.getElementById('overlay-text').style.display = 'flex';
            document.getElementById('complete-btn').disabled = true;
            document.getElementById('complete-btn').className = 'btn btn-secondary';

            document.getElementById('mission-modal').style.display = 'block';
        }

        function wipeDust() {
            document.getElementById('target-photo').style.filter = 'blur(0px)';
            document.getElementById('overlay-text').style.display = 'none';
            
            let btn = document.getElementById('complete-btn');
            btn.disabled = false;
            btn.className = 'btn';
        }

        function savePhoto() {
            let photoData = {
                id: activeCapsule.id,
                title: activeCapsule.title,
                date: new Date().toLocaleDateString(),
                url: activeCapsule.url,
                desc: activeCapsule.desc
            };

            let album = getAlbum();
            if (!album.some(item => item.id === photoData.id)) {
                album.push(photoData);
                localStorage.setItem('gwangmyeong_album', JSON.stringify(album));
                alert("🎉 성공적으로 사진을 도감에 수집했습니다!");
                renderCapsuleMarkers();
            } else {
                alert("이미 도감에 등록된 사진입니다!");
            }

            closeModal('mission-modal');
        }

        function openAdminModal() {
            renderAdminList();
            document.getElementById('admin-modal').style.display = 'block';
        }

        function toggleAdminList() {
            let listDiv = document.getElementById('admin-capsule-list');
            let icon = document.getElementById('list-toggle-icon');
            if (listDiv.style.display === 'block') {
                listDiv.style.display = 'none';
                icon.innerText = '▼';
            } else {
                listDiv.style.display = 'block';
                icon.innerText = '▲';
                renderAdminList();
            }
        }

        function renderAdminList() {
            let listDiv = document.getElementById('admin-capsule-list');
            listDiv.innerHTML = "";
            let capsules = getCapsules();

            if (capsules.length === 0) {
                listDiv.innerHTML = "<p style='color:#888; font-size:11px;'>등록된 캡슐이 없습니다.</p>";
            } else {
                capsules.forEach((cap) => {
                    listDiv.innerHTML += `
                        <div class="list-item">
                            <img src="${cap.url}" alt="미리보기">
                            <div style="flex-grow:1; margin-left:6px; overflow:hidden;">
                                <div style="font-weight:bold; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${cap.title}</div>
                                <div style="font-size:9px; color:#888;">${cap.lat.toFixed(3)}, ${cap.lon.toFixed(3)}</div>
                            </div>
                            <button class="btn btn-edit" onclick="editCapsule('${cap.id}')">수정</button>
                            <button class="btn btn-danger" onclick="deleteCapsule('${cap.id}')">삭제</button>
                        </div>
                    `;
                });
            }
        }

        function editCapsule(id) {
            let capsules = getCapsules();
            let cap = capsules.find(c => c.id === id);
            if (!cap) return;

            document.getElementById('edit-capsule-id').value = cap.id;
            document.getElementById('admin-title').value = cap.title;
            document.getElementById('admin-url').value = cap.url;
            document.getElementById('admin-desc').value = cap.desc;
            
            pickedLat = cap.lat;
            pickedLon = cap.lon;
            document.getElementById('selected-coords-text').innerText = `선택된 위치: 위도 ${pickedLat.toFixed(4)}, 경도 ${pickedLon.toFixed(4)}`;

            document.getElementById('admin-modal-title').innerText = "🛠️ 타임캡슐 수정 모드";
            document.getElementById('admin-submit-btn').innerText = "💾 타임캡슐 수정 완료";
            document.getElementById('admin-cancel-edit-btn').style.display = 'block';
        }

        function resetAdminForm() {
            document.getElementById('edit-capsule-id').value = "";
            document.getElementById('admin-title').value = "";
            document.getElementById('admin-desc').value = "";
            document.getElementById('admin-file').value = "";
            document.getElementById('admin-url').value = "";
            document.getElementById('selected-coords-text').innerText = "선택된 위치: 미지정 (아래 버튼을 누르세요)";
            pickedLat = null;
            pickedLon = null;
            if (tempPickMarker) {
                map.removeLayer(tempPickMarker);
                tempPickMarker = null;
            }

            document.getElementById('admin-modal-title').innerText = "🛠️ 타임캡슐 관리자 모드";
            document.getElementById('admin-submit-btn').innerText = "✨ 타임캡슐 등록하기";
            document.getElementById('admin-cancel-edit-btn').style.display = 'none';
        }

        // 🌟 초경량 압축 (최대 300px, 품질 0.6)으로 저장 공간 초과 원천 차단
        function processAndSaveCapsule() {
            let editId = document.getElementById('edit-capsule-id').value;
            let title = document.getElementById('admin-title').value.trim();
            let desc = document.getElementById('admin-desc').value.trim();
            let urlInput = document.getElementById('admin-url').value.trim();
            let fileInput = document.getElementById('admin-file');

            if (!title) {
                alert("타임캡슐 제목을 입력해주세요!");
                return;
            }
            if (pickedLat === null || pickedLon === null) {
                alert("먼저 [지도에서 위치 직접 찍기] 버튼을 눌러 지도 위를 터치해주세요!");
                return;
            }

            if (fileInput.files && fileInput.files[0]) {
                let file = fileInput.files[0];
                let reader = new FileReader();

                reader.onload = function(e) {
                    let img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        let canvas = document.createElement('canvas');
                        let max_size = 300; // 초경량화
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > max_size) { height *= max_size / width; width = max_size; }
                        } else {
                            if (height > max_size) { width *= max_size / height; height = max_size; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        let ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        let compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        
                        try {
                            saveCapsuleData(editId, title, desc, compressedDataUrl, pickedLat, pickedLon);
                        } catch (err) {
                            alert("⚠️ 저장 공간이 가득 찼습니다. 이미지 URL 방식을 이용해 주세요.");
                        }
                    };
                };
                reader.readAsDataURL(file);
            } else if (urlInput) {
                saveCapsuleData(editId, title, desc, urlInput, pickedLat, pickedLon);
            } else {
                alert("사진 파일을 선택하거나 이미지 URL을 입력해주세요!");
            }
        }

        function saveCapsuleData(editId, title, desc, imageUrl, lat, lon) {
            let capsules = getCapsules();

            if (editId) {
                let index = capsules.findIndex(c => c.id === editId);
                if (index !== -1) {
                    capsules[index].title = title;
                    capsules[index].desc = desc || "역사 타임캡슐입니다.";
                    capsules[index].url = imageUrl;
                    capsules[index].lat = lat;
                    capsules[index].lon = lon;
                    alert("✨ 타임캡슐이 성공적으로 수정되었습니다!");
                }
            } else {
                let newCapsule = {
                    id: "capsule_" + Date.now(),
                    title: title,
                    lat: lat,
                    lon: lon,
                    url: imageUrl,
                    desc: desc || "새로 발굴된 역사 타임캡슐입니다."
                };
                capsules.push(newCapsule);
                alert("✨ 새로운 타임캡슐이 성공적으로 등록되었습니다!");
            }

            localStorage.setItem('gwangmyeong_capsules', JSON.stringify(capsules));
            
            resetAdminForm();
            closeModal('admin-modal');
            renderCapsuleMarkers();
        }

        function deleteCapsule(id) {
            if (confirm("정말 이 타임캡슐을 삭제하시겠습니까?")) {
                let capsules = getCapsules();
                capsules = capsules.filter(c => c.id !== id);
                localStorage.setItem('gwangmyeong_capsules', JSON.stringify(capsules));
                renderAdminList();
                renderCapsuleMarkers();
            }
        }

        function openAlbum() {
            let albumList = document.getElementById('album-list');
            albumList.innerHTML = "";
            let album = getAlbum();
            
            if (album.length === 0) {
                albumList.innerHTML = "<p style='color:#888; text-align:center;'>아직 수집한 사진이 없습니다.<br>타임캡슐을 찾아보세요!</p>";
            } else {
                album.forEach(item => {
                    albumList.innerHTML += `
                        <div class="list-item">
                            <img src="${item.url}" alt="사진">
                            <div>
                                <div style="font-weight:bold; font-size:12px;">${item.title}</div>
                                <div style="font-size:10px; color:#888;">${item.desc}</div>
                                <div style="font-size:9px; color:#aaa;">획득일: ${item.date}</div>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('album-modal').style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if(modalId === 'admin-modal') {
                resetAdminForm();
                document.getElementById('admin-capsule-list').style.display = 'none';
                document.getElementById('list-toggle-icon').innerText = '▼';
            }
        }
    </script>
</body>
</html>
