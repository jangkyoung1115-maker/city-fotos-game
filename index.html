<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타임슬립 탐험대 - 마커 구분 버전</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; background: #f4f4f9; }
        #map { width: 100%; height: 100vh; }
        
        /* 상단 UI 패널 */
        .top-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 10px 20px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 1000; display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 13px;
        }
        .resource-badge { color: #ff5722; }
        .step-badge { color: #4caf50; }
        .album-btn { background: #3f51b5; color: white; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 12px; }

        /* 하단 가이드 배너 */
        .guide-banner {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px; border-radius: 20px;
            z-index: 1000; font-size: 13px; text-align: center; max-width: 90%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 팝업 모달 스타일 */
        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 2000; text-align: center; width: 85%; max-width: 340px; box-sizing: border-box;
        }
        .modal h3 { margin-top: 0; color: #333; }
        .btn {
            background: #ff5722; color: white; border: none; padding: 12px 20px;
            border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 14px;
        }
        .btn-secondary { background: #ccc; color: #333; }

        /* 먼지 닦기 미니게임 박스 */
        #scratch-box {
            width: 100%; height: 150px; background: #ddd; border-radius: 10px;
            position: relative; overflow: hidden; margin: 15px 0; display: flex; align-items: center; justify-content: center;
        }
        #scratch-box img { width: 100%; height: 100%; object-fit: cover; filter: blur(5px); transition: 0.5s; }
        .scratch-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #888;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer;
        }

        /* 사진첩 도감 모달 */
        #album-modal { max-height: 80vh; overflow-y: auto; text-align: left; }
        .album-item { display: flex; gap: 10px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; align-items: center; }
        .album-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- 상단 상태바 -->
    <div class="top-panel">
        <span>🎞️ <span id="film-count" class="resource-badge">15</span>개</span>
        <span>👣 <span id="step-count" class="step-badge">0</span>걸음</span>
        <button class="album-btn" onclick="openAlbum()">내 사진첩</button>
    </div>

    <!-- 하단 가이드 배너 -->
    <div id="guide-banner" class="guide-banner">
        GPS 위치를 탐색 중입니다...
    </div>

    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 1. 타임캡슐 발견 팝업 -->
    <div id="discovery-modal" class="modal">
        <h3>⏳ 타임캡슐 발견!</h3>
        <p>추억의 옛 풍경이 담긴 타임캡슐입니다.</p>
        <p style="font-size: 13px; color: #666;">필요 자원: 빛바랜 필름 10개</p>
        <button class="btn" onclick="startMission()">필름 10개 소모하고 개봉하기</button>
        <button class="btn btn-secondary" onclick="closeModal('discovery-modal')">나중에 하기</button>
    </div>

    <!-- 2. 미니게임 (먼지 닦기) 팝업 -->
    <div id="mission-modal" class="modal">
        <h3>🧹 사진 복원 미니게임</h3>
        <p style="font-size: 13px; color: #666;">화면을 문질러 세월의 먼지를 닦아내세요!</p>
        <div id="scratch-box" ontouchmove="wipeDust()" onclick="wipeDust()">
            <img src="https://images.unsplash.com/photo-1517732306149-e8f829eb588a?w=400" id="target-photo" alt="옛 사진">
            <div id="overlay-text" class="scratch-overlay">여기를 터치해 먼지 닦기!</div>
        </div>
        <button id="complete-btn" class="btn btn-secondary" disabled onclick="savePhoto()">사진첩에 저장하기</button>
    </div>

    <!-- 3. 내 사진첩 (도감) 모달 -->
    <div id="album-modal" class="modal">
        <h3>📖 나의 타임슬립 앨범</h3>
        <div id="album-list"></div>
        <button class="btn btn-secondary" onclick="closeModal('album-modal')">닫기</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([37.5665, 126.9780], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var userMarker = null;
        var capsuleMarker = null;
        var dustMarkers = [];
        
        var targetLat = null;
        var targetLon = null;
        let hasDiscovered = false;
        let isFirstGPS = true;

        let totalSteps = 0;
        let accumulatedMeters = 0;
        let userFilms = 15;

        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            var R = 6371000;
            var dLat = (lat2 - lat1) * (Math.PI / 180);
            var dLon = (lon2 - lon1) * (Math.PI / 180);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 시간의 먼지 오브젝트 생성
        function spawnDustObjects(centerLat, centerLon) {
            let offsets = [
                {dLat: 0.0003, dLon: 0.0003},
                {dLat: -0.0003, dLon: 0.0004},
                {dLat: 0.0004, dLon: -0.0003}
            ];

            offsets.forEach((offset) => {
                let dLat = centerLat + offset.dLat;
                let dLon = centerLon + offset.dLon;

                let dustIcon = L.divIcon({
                    className: 'custom-dust',
                    html: '<div style="background:#2196f3; width:22px; height:22px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(33,150,243,0.8); display:flex; align-items:center; justify-content:center; color:white; font-size:11px;">✨</div>',
                    iconSize: [22, 22]
                });

                let marker = L.marker([dLat, dLon], {icon: dustIcon}).addTo(map);
                marker.bindPopup("<b>✨ 시간의 먼지 조각</b><br>터치해서 필름을 수집하세요!");
                
                marker.on('click', function() {
                    let dist = getDistanceFromLatLonInMeters(userMarker.getLatLng().lat, userMarker.getLatLng().lng, dLat, dLon);
                    if (dist <= 30) {
                        userFilms += 2;
                        document.getElementById('film-count').innerText = userFilms;
                        alert("✨ 시간의 먼지를 수집했습니다! (빛바랜 필름 +2 획득)");
                        map.removeLayer(marker);
                    } else {
                        alert("너무 멀리 있습니다! 먼지 조각 가까이 다가가세요. (30m 이내)");
                    }
                });

                dustMarkers.push(marker);
            });
        }

        let lastLat = null;
        let lastLon = null;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;

                    if (isFirstGPS) {
                        isFirstGPS = false;
                        targetLat = lat + 0.0005; // 약 50m 위 타임캡슐
                        targetLon = lon;

                        // ⏳ 타임캡슐 전용 커스텀 아이콘 (보라색 빛나는 캡슐 디자인)
                        let capsuleIcon = L.divIcon({
                            className: 'custom-capsule',
                            html: '<div style="background:linear-gradient(135deg, #9c27b0, #673ab7); width:36px; height:36px; border-radius:50%; border:3px solid white; box-shadow:0 0 12px rgba(156,39,176,0.9); display:flex; align-items:center; justify-content:center; color:white; font-size:16px; font-weight:bold;">⏳</div>',
                            iconSize: [36, 36],
                            iconAnchor: [18, 18]
                        });

                        capsuleMarker = L.marker([targetLat, targetLon], {icon: capsuleIcon}).addTo(map).bindPopup("<b>🎁 [테스트] 1980년대 타임캡슐</b>").openPopup();
                        
                        // 내 위치 전용 아이콘 (파란색 커서)
                        let userIcon = L.divIcon({
                            className: 'custom-user',
                            html: '<div style="background:#007aff; width:20px; height:20px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(0,122,255,0.8);"></div>',
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });

                        userMarker = L.marker([lat, lon], {icon: userIcon}).addTo(map).bindPopup("<b>내 위치</b>");

                        spawnDustObjects(lat, lon);

                        lastLat = lat;
                        lastLon = lon;
                    } else {
                        let movedMeters = getDistanceFromLatLonInMeters(lastLat, lastLon, lat, lon);
                        if (movedMeters > 2) {
                            accumulatedMeters += movedMeters;
                            lastLat = lat;
                            lastLon = lon;

                            let newSteps = Math.floor(accumulatedMeters / 0.7);
                            if (newSteps > totalSteps) {
                                let addedSteps = newSteps - totalSteps;
                                totalSteps = newSteps;
                                document.getElementById('step-count').innerText = totalSteps;

                                if (totalSteps % 1000 === 0) {
                                    userFilms += 1;
                                    document.getElementById('film-count').innerText = userFilms;
                                    alert("👣 1000걸음 달성! 보상으로 빛바랜 필름 1개가 충전되었습니다!");
                                }
                            }
                        }
                    }

                    userMarker.setLatLng([lat, lon]);
                    map.setView([lat, lon], 17);

                    var distance = getDistanceFromLatLonInMeters(lat, lon, targetLat, targetLon);
                    let banner = document.getElementById('guide-banner');

                    if (distance <= 50 && distance > 10) {
                        banner.innerText = `✨ 근처에 타임캡슐이 숨겨져 있습니다! (약 ${Math.round(distance)}m)`;
                    } else if (distance <= 10) {
                        banner.innerText = "🎯 타임캡슐 발견 지점에 도달했습니다!";
                        if (!hasDiscovered) {
                            hasDiscovered = true;
                            document.getElementById('discovery-modal').style.display = 'block';
                        }
                    } else {
                        banner.innerText = `타임캡슐까지 거리: 약 ${Math.round(distance)}m | 파란색 먼지를 터치해 필름을 모아보세요!`;
                    }
                },
                function(error) { 
                    console.error("GPS 오류", error);
                    document.getElementById('guide-banner').innerText = "⚠️ GPS 위치를 가져올 수 없습니다. 위치 권한을 확인해주세요.";
                },
                { enableHighAccuracy: true }
            );
        }

        function startMission() {
            if (userFilms < 10) {
                alert("빛바랜 필름이 부족합니다! (필요: 10개)\n길가에 흩어진 파란색 '시간의 먼지'를 터치해 모아보세요.");
                return;
            }
            userFilms -= 10;
            document.getElementById('film-count').innerText = userFilms;
            
            closeModal('discovery-modal');
            document.getElementById('mission-modal').style.display = 'block';
        }

        function wipeDust() {
            document.getElementById('target-photo').style.filter = 'blur(0px)';
            document.getElementById('overlay-text').style.display = 'none';
            
            let btn = document.getElementById('complete-btn');
            btn.disabled = false;
            btn.className = 'btn';
        }

        function savePhoto() {
            let photoData = {
                title: "추억의 옛 풍경 타임캡슐",
                date: new Date().toLocaleDateString(),
                url: "https://images.unsplash.com/photo-1517732306149-e8f829eb588a?w=400"
            };

            let album = JSON.parse(localStorage.getItem('gwangmyeong_album') || '[]');
            if (!album.some(item => item.title === photoData.title)) {
                album.push(photoData);
                localStorage.setItem('gwangmyeong_album', JSON.stringify(album));
                alert("🎉 성공적으로 사진을 도감에 수집했습니다!");
            } else {
                alert("이미 도감에 등록된 사진입니다!");
            }

            closeModal('mission-modal');
        }

        function openAlbum() {
            let albumList = document.getElementById('album-list');
            albumList.innerHTML = "";
            
            let album = JSON.parse(localStorage.getItem('gwangmyeong_album') || '[]');
            
            if (album.length === 0) {
                albumList.innerHTML = "<p style='color:#888; text-align:center;'>아직 수집한 사진이 없습니다.<br>타임캡슐을 찾아보세요!</p>";
            } else {
                album.forEach(item => {
                    albumList.innerHTML += `
                        <div class="album-item">
                            <img src="${item.url}" alt="사진">
                            <div>
                                <div style="font-weight:bold; font-size:14px;">${item.title}</div>
                                <div style="font-size:11px; color:#888;">획득일: ${item.date}</div>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('album-modal').style.display = 'block';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>
</body>
</html>
