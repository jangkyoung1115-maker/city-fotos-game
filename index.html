<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타임슬립 탐험대 - 줌 반응형 마커 버전</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Firebase SDK 추가 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; background: #f4f4f9; }
        #map { width: 100%; height: 100vh; }
        
        /* 상단 UI 패널 */
        .top-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 10px 18px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 1000; display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 11px;
        }
        .resource-badge { color: #ff5722; }
        .step-badge { color: #4caf50; }
        .action-btn { background: #3f51b5; color: white; border: none; padding: 6px 10px; border-radius: 15px; cursor: pointer; font-size: 11px; }
        .admin-btn { background: #e91e63; color: white; display: none; }
        .list-btn { background: #ff9800; color: white; display: none; }
        .bulk-btn { background: #00bcd4; color: white; display: none; }
        .bulk-btn.active { background: #ff5722; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* 하단 가이드 배너 */
        .guide-banner {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 20px; border-radius: 20px;
            z-index: 1000; font-size: 13px; text-align: center; max-width: 90%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 팝업 모달 스타일 */
        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 9999; text-align: center; width: 90%; max-width: 450px; box-sizing: border-box;
        }
        .modal h3 { margin-top: 0; color: #333; }
        .btn {
            background: #ff5722; color: white; border: none; padding: 10px 20px;
            border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 13px;
        }
        .btn-secondary { background: #ccc; color: #333; }
        .btn-danger { background: #f44336; color: white; padding: 4px 8px; font-size: 10px; margin-top: 0; width: auto; }
        .btn-edit { background: #ff9800; color: white; padding: 4px 8px; font-size: 10px; margin-top: 0; width: auto; }

        .form-input {
            width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 13px;
        }

        /* 미니게임 사진 정중앙 정렬 */
        #scratch-box {
            width: 100%; height: 180px; background: #111; border-radius: 10px;
            position: relative; overflow: hidden; margin: 15px 0; 
            display: flex; align-items: center; justify-content: center;
        }
        #scratch-box img { 
            max-width: 100%; max-height: 100%; object-fit: contain;
            filter: blur(5px); transition: 0.5s; 
            margin: auto; display: block;
        }
        .scratch-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer; z-index: 2;
        }

        .title-badge-box { background: #fff8e1; border: 1px solid #ffe082; padding: 8px; border-radius: 10px; margin-bottom: 10px; font-size: 12px; font-weight: bold; color: #f57f17; }
        
        .slots-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 45vh; overflow-y: auto; padding: 4px; }
        .photo-slot { aspect-ratio: 1; background: #f0f0f5; border: 2px dashed #ccc; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .photo-slot.filled { border: 2px solid #ffd700; background: #fff; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
        .photo-slot span { font-size: 9px; color: #aaa; }

        .scroll-list { max-height: 40vh; overflow-y: auto; text-align: left; margin-bottom: 10px; }
        .list-item { display: flex; gap: 8px; margin-bottom: 6px; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; align-items: center; justify-content: space-between; }
        .list-item img { width: 35px; height: 35px; border-radius: 4px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- 상단 상태바 -->
    <div class="top-panel">
        <span>🎞️ <span id="film-count" class="resource-badge">15</span></span>
        <span>👣 <span id="step-count" class="step-badge">0</span></span>
        <button class="action-btn" onclick="openAlbum()">사진첩(도감)</button>
        <button id="admin-mode-btn" class="action-btn admin-btn" onclick="openAdminModal()">타임캡슐 등록</button>
        <button id="admin-bulk-btn" class="action-btn bulk-btn" onclick="toggleBulkFilmMode()">필름 연속 배치: OFF</button>
        <button id="admin-list-btn" class="action-btn list-btn" onclick="openAdminListModal()">캡슐 목록</button>
    </div>

    <!-- 하단 가이드 배너 -->
    <div id="guide-banner" class="guide-banner">
        광명시 GPS 위치를 탐색 중입니다...
    </div>

    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 1. 타임캡슐 발견 팝업 -->
    <div id="discovery-modal" class="modal">
        <h3 id="discovery-title">⏳ 타임캡슐 발견!</h3>
        <p id="discovery-desc">추억의 옛 풍경이 담긴 타임캡슐입니다.</p>
        <p style="font-size: 13px; color: #666;">필요 자원: 빛바랜 필름 10개</p>
        <button class="btn" onclick="startMission()">필름 10개 소모하고 개봉하기</button>
        <button class="btn btn-secondary" onclick="closeModal('discovery-modal')">나중에 하기</button>
    </div>

    <!-- 2. 미니게임 (먼지 닦기) 팝업 -->
    <div id="mission-modal" class="modal">
        <h3>🧹 사진 복원 미니게임</h3>
        <p style="font-size: 13px; color: #666;">화면을 문질러 세월의 먼지를 닦아내세요!</p>
        <div id="scratch-box" ontouchmove="wipeDust()" onclick="wipeDust()">
            <img src="" id="target-photo" alt="옛 사진">
            <div id="overlay-text" class="scratch-overlay">여기를 터치해 먼지 닦기!</div>
        </div>
        <button id="complete-btn" class="btn btn-secondary" disabled onclick="savePhoto()">사진첩에 저장하기</button>
    </div>

    <!-- 3. 100개 슬롯 도감 모달 & 칭호 시스템 -->
    <div id="album-modal" class="modal" style="max-width: 440px;">
        <h3>📖 광명시 타임슬립 100선 도감</h3>
        <div id="region-title-box" class="title-badge-box">
            현재 칭호: <span id="current-region-title">초보 탐험가</span> (0/100 수집)
        </div>
        <div id="slots-grid-container" class="slots-grid"></div>
        <button class="btn btn-secondary" onclick="closeModal('album-modal')" style="margin-top: 10px;">닫기</button>
    </div>

    <!-- 4. 사진 상세 확대 보기 및 다운로드 모달 -->
    <div id="photo-detail-modal" class="modal" style="max-width: 90%; width: 90%; padding: 15px;">
        <h3 id="detail-title" style="font-size: 15px; margin-bottom: 5px;">제목</h3>
        <div style="width: 100%; height: 50vh; overflow: auto; background: #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative;">
            <img id="detail-img" src="" alt="확대 사진" style="max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.2s;" onclick="toggleZoomImage(this)">
        </div>
        <p id="detail-desc" style="font-size: 12px; color: #666; margin: 6px 0 0 0;"></p>
        <p id="detail-date" style="font-size: 10px; color: #999; margin: 2px 0 0 0;"></p>
        <button class="btn" style="background: #4caf50; margin-top: 8px; padding: 10px; font-size: 13px;" onclick="downloadPhoto()">📥 사진 원본 다운로드</button>
        <button class="btn btn-secondary" onclick="closeModal('photo-detail-modal')" style="margin-top: 5px; padding: 8px;">닫기</button>
    </div>

    <!-- 5. 관리자 타임캡슐 모달 -->
    <div id="admin-modal" class="modal" style="max-width: 380px;">
        <h3 id="admin-modal-title">🛠️ 타임캡슐 등록</h3>
        
        <input type="hidden" id="edit-capsule-id" value="">

        <input type="text" id="admin-title" class="form-input" placeholder="타임캡슐 제목 (예: 철산동 옛 거리)">
        <input type="text" id="admin-region" class="form-input" placeholder="지역 설명 (예: 광명동, 철산동 등)" value="광명동">

        <div style="background: #fdfdfd; padding: 6px; border-radius: 8px; margin: 4px 0; border: 1px solid #ddd; text-align: left;">
            <label style="font-size: 11px; font-weight: bold; color: #333;">📸 사진 선택 (폰 갤러리)</label>
            <input type="file" id="admin-file" accept="image/*" class="form-input" style="margin-top: 2px; font-size: 11px; padding: 4px;">
            <div style="font-size: 10px; color: #666; margin: 2px 0; text-align: center;">--- 또는 이미지 URL (추천) ---</div>
            <input type="text" id="admin-url" class="form-input" placeholder="https:// 이미지 주소 입력" style="margin-bottom: 2px; padding: 6px;">
        </div>

        <input type="text" id="admin-desc" class="form-input" placeholder="상세 설명">
        
        <div style="background: #e8f5e9; padding: 8px; border-radius: 8px; margin: 6px 0; border: 1px solid #a5d6a7;">
            <div id="selected-coords-text" style="font-size: 11px; color: #2e7d32; font-weight: bold; margin-bottom: 4px;">📍 현재 지도 중심 위치로 자동 지정됨</div>
            <button class="btn" style="background: #3f51b5; margin-top: 0; padding: 6px; font-size: 11px;" onclick="startPickingLocation()">지도를 직접 터치해서 지정하기</button>
        </div>

        <button id="admin-submit-btn" class="btn" style="background:#4caf50; margin-top: 6px; padding: 10px;" onclick="processAndSaveCapsule()">✨ 타임캡슐 등록하기</button>
        <button id="admin-cancel-edit-btn" class="btn btn-secondary" style="display:none; margin-top: 4px; padding: 6px;" onclick="resetAdminForm()">수정 취소</button>
        
        <button class="btn btn-secondary" onclick="closeModal('admin-modal')" style="margin-top: 10px; padding: 10px;">닫기</button>
    </div>

    <!-- 6. 독립된 등록된 캡슐 목록 모달 -->
    <div id="admin-list-modal" class="modal" style="max-width: 380px;">
        <h3>📂 등록된 캡슐 목록</h3>
        <div id="admin-capsule-list" class="scroll-list"></div>
        <button class="btn btn-secondary" onclick="closeModal('admin-list-modal')" style="margin-top: 10px; padding: 10px;">닫기</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAjH7abrM1-0a7OG1KdSsIlIAJmR_b3ypw",
            authDomain: "time-capsule-e8725.firebaseapp.com",
            projectId: "time-capsule-e8725",
            storageBucket: "time-capsule-e8725.firebasestorage.app",
            messagingSenderId: "1021563795745",
            appId: "1:1021563795745:web:6d5733948d3363f696a660"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cachedCapsules = [];
        let cachedFilms = [];
        let isAdminMode = false;
        let isBulkFilmMode = false;

        window.addEventListener('DOMContentLoaded', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') {
                isAdminMode = true;
                document.getElementById('admin-mode-btn').style.display = 'inline-block';
                document.getElementById('admin-bulk-btn').style.display = 'inline-block';
                document.getElementById('admin-list-btn').style.display = 'inline-block';
            }
            loadUserData();
            initRealtimeData();
        });

        var map = L.map('map').setView([37.4784, 126.8646], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var userMarker = null;
        var capsuleMarkers = {};
        var filmMarkers = {};
        var tempPickMarker = null;
        
        let currentLat = 37.4784;
        let currentLon = 126.8646;
        let activeCapsule = null;
        let currentMissionCapsule = null;
        let pickedLat = null;
        let pickedLon = null;
        let isPickingMode = false;

        let totalSteps = 0;
        let accumulatedMeters = 0;
        let userFilms = 15;
        let isFirstGPS = true;

        function loadUserData() {
            let savedSteps = localStorage.getItem('gwangmyeong_steps');
            let savedMeters = localStorage.getItem('gwangmyeong_meters');
            let savedFilms = localStorage.getItem('gwangmyeong_films');

            if (savedSteps !== null) totalSteps = parseInt(savedSteps);
            if (savedMeters !== null) accumulatedMeters = parseFloat(savedMeters);
            if (savedFilms !== null) {
                userFilms = parseInt(savedFilms);
            } else {
                userFilms = 15;
                localStorage.setItem('gwangmyeong_films', userFilms);
            }

            document.getElementById('step-count').innerText = totalSteps;
            document.getElementById('film-count').innerText = userFilms;
        }

        function saveUserData() {
            localStorage.setItem('gwangmyeong_steps', totalSteps);
            localStorage.setItem('gwangmyeong_meters', accumulatedMeters);
            localStorage.setItem('gwangmyeong_films', userFilms);
        }

        function initRealtimeData() {
            db.collection("capsules").onSnapshot((snapshot) => {
                cachedCapsules = [];
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    data.id = doc.id;
                    cachedCapsules.push(data);
                });

                if (cachedCapsules.length === 0) {
                    let defaultCap = {
                        title: "1980년대 광명시장 전경",
                        region: "광명동",
                        lat: 37.4784,
                        lon: 126.8646,
                        url: "https://images.unsplash.com/photo-1517732306149-e8f829eb588a?w=400",
                        desc: "활기 넘쳤던 옛 광명시장 입구의 풍경입니다."
                    };
                    db.collection("capsules").add(defaultCap);
                } else {
                    renderMarkers();
                }
            });

            db.collection("admin_films").onSnapshot((snapshot) => {
                cachedFilms = [];
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    data.id = doc.id;
                    cachedFilms.push(data);
                });
                renderMarkers();
            });
        }

        function getCapsules() {
            return cachedCapsules;
        }

        function getAlbum() {
            return JSON.parse(localStorage.getItem('gwangmyeong_album') || '[]');
        }

        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            var R = 6371000;
            var dLat = (lat2 - lat1) * (Math.PI / 180);
            var dLon = (lon2 - lon1) * (Math.PI / 180);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 🌟 지도의 줌 레벨에 따라 마커 크기를 반응형으로 계산하는 함수
        function getResponsiveMarkerConfig() {
            let zoom = map.getZoom();
            // zoom이 낮을수록(멀리 볼수록) 배율을 작게 조절 (기본 기준 zoom 15)
            let scale = Math.max(0.4, Math.min(1.3, Math.pow(1.15, zoom - 15)));
            
            let capsuleW = Math.round(30 * scale);
            let capsuleH = Math.round(38 * scale);
            let capsuleFont = Math.round(13 * scale);

            let filmFont = Math.round(20 * scale);

            return {
                capsule: { size: [capsuleW, capsuleH], anchor: [capsuleW/2, capsuleH], font: capsuleFont },
                film: { size: [Math.round(24 * scale), Math.round(24 * scale)], anchor: [Math.round(12 * scale), Math.round(12 * scale)], font: filmFont }
            };
        }

        // 마커 전체 렌더링 (줌 변경 시에도 호출)
        function renderMarkers() {
            let config = getResponsiveMarkerConfig();

            // 1. 타임캡슐 마커 렌더링
            for (let id in capsuleMarkers) {
                map.removeLayer(capsuleMarkers[id].marker);
            }
            capsuleMarkers = {};

            let capsules = getCapsules();
            let album = getAlbum();

            capsules.forEach(cap => {
                let collected = album.some(item => item.id === cap.id);
                
                let pinBg = collected ? '#ffb300' : '#8e24aa';
                let pinShadow = collected ? 'rgba(255,179,0,0.8)' : 'rgba(142,36,170,0.8)';
                let pinEmoji = collected ? '🏆' : '⏳';

                let w = config.capsule.size[0];
                let h = config.capsule.size[1];
                let pinSize = Math.round(w * 0.9);

                let dropPinIcon = L.divIcon({
                    className: 'custom-droplet-pin',
                    html: `
                        <div style="position:relative; width:${w}px; height:${h}px;">
                            <div style="width:${pinSize}px; height:${pinSize}px; background:${pinBg}; border-radius:50% 50% 50% 0; transform:rotate(-45deg); position:absolute; top:0; left:0; border:2px solid white; box-shadow:0 3px 6px ${pinShadow};"></div>
                            <div style="position:absolute; top:0; left:0; width:${pinSize}px; height:${pinSize}px; display:flex; align-items:center; justify-content:center; font-size:${config.capsule.font}px;">${pinEmoji}</div>
                        </div>
                    `,
                    iconSize: [w, h],
                    iconAnchor: [w/2, h],
                    popupAnchor: [0, -h]
                });

                let marker = L.marker([cap.lat, cap.lon], {icon: dropPinIcon}).addTo(map);
                marker.bindPopup(`<b>[${cap.region || '기타'}] ${cap.title}</b><br>${collected ? '수집 완료됨 (황금빛 핀)' : '미발견 타임캡슐 (보라색 핀)'}`);
                
                capsuleMarkers[cap.id] = { marker: marker, data: cap, collected: collected };
            });

            // 2. 필름 조각 마커 렌더링
            for (let id in filmMarkers) {
                map.removeLayer(filmMarkers[id]);
            }
            filmMarkers = {};

            cachedFilms.forEach(film => {
                let fw = config.film.size[0];
                let fh = config.film.size[1];

                let miniFilmIcon = L.divIcon({
                    className: 'custom-mini-film',
                    html: `
                        <div style="
                            font-size: ${config.film.font}px; 
                            line-height: 1;
                            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
                            display: flex; align-items: center; justify-content: center;
                            width: ${fw}px; height: ${fh}px;
                        ">🎞️</div>
                    `,
                    iconSize: [fw, fh],
                    iconAnchor: [fw/2, fh/2]
                });

                let marker = L.marker([film.lat, film.lon], {icon: miniFilmIcon}).addTo(map);
                
                if (isAdminMode) {
                    marker.bindPopup("<b>🛠️ [관리자] 필름 조각</b><br>클릭하면 이 필름이 삭제됩니다.");
                } else {
                    marker.bindPopup("<b>🎞️ 푸른 필름 조각</b><br>가까이 다가가서 수집하세요!");
                }
                
                marker.on('click', function() {
                    if (isAdminMode) {
                        if (confirm("🗑️ 이 필름 조각을 삭제하시겠습니까?")) {
                            db.collection("admin_films").doc(film.id).delete();
                        }
                    } else {
                        let dist = getDistanceFromLatLonInMeters(currentLat, currentLon, film.lat, film.lon);
                        if (dist <= 40) {
                            userFilms += 2;
                            document.getElementById('film-count').innerText = userFilms;
                            saveUserData();
                            alert("🎞️ 필름 조각을 수집했습니다! (빛바랜 필름 +2 획득)");
                            db.collection("admin_films").doc(film.id).delete();
                        } else {
                            alert("너무 멀리 있습니다! 필름 조각 가까이 다가가세요. (40m 이내)");
                        }
                    }
                });

                filmMarkers[film.id] = marker;
            });
        }

        // 지도가 확대/축소될 때마다 마커 크기 실시간 업데이트
        map.on('zoomend', function() {
            renderMarkers();
        });

        let lastLat = null;
        let lastLon = null;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;

                    if (isFirstGPS) {
                        isFirstGPS = false;
                        
                        let userIcon = L.divIcon({
                            className: 'custom-user',
                            html: '<div style="background:#00c853; width:15px; height:15px; border-radius:50%; border:2px solid white; box-shadow:0 0 6px rgba(0,200,83,0.8);"></div>',
                            iconSize: [15, 15],
                            iconAnchor: [7.5, 7.5]
                        });

                        userMarker = L.marker([currentLat, currentLon], {icon: userIcon}).addTo(map).bindPopup("<b>내 위치</b>");
                        map.setView([currentLat, currentLon], 14);

                        renderMarkers();

                        lastLat = currentLat;
                        lastLon = currentLon;
                    } else {
                        let movedMeters = getDistanceFromLatLonInMeters(lastLat, lastLon, currentLat, currentLon);
                        if (movedMeters > 2) {
                            accumulatedMeters += movedMeters;
                            lastLat = currentLat;
                            lastLon = currentLon;

                            let newSteps = Math.floor(accumulatedMeters / 0.7);
                            if (newSteps > totalSteps) {
                                totalSteps = newSteps;
                                document.getElementById('step-count').innerText = totalSteps;
                                saveUserData();

                                if (totalSteps % 1000 === 0) {
                                    userFilms += 1;
                                    document.getElementById('film-count').innerText = userFilms;
                                    saveUserData();
                                    alert("👣 1000걸음 달성! 보상으로 필름 1개가 충전되었습니다!");
                                }
                            }
                        }
                    }

                    userMarker.setLatLng([currentLat, currentLon]);

                    let capsules = getCapsules();
                    let album = getAlbum();
                    let nearestCapsule = null;
                    let minDistance = 999999;

                    capsules.forEach(cap => {
                        let dist = getDistanceFromLatLonInMeters(currentLat, currentLon, cap.lat, cap.lon);
                        if (dist < minDistance) {
                            minDistance = dist;
                            nearestCapsule = cap;
                        }
                    });

                    let banner = document.getElementById('guide-banner');
                    if (nearestCapsule) {
                        let isCollected = album.some(item => item.id === nearestCapsule.id);
                        if (minDistance <= 15 && !isCollected) {
                            banner.innerText = `🎯 [${nearestCapsule.title}] 발견 지점 도달!`;
                            if (!activeCapsule || activeCapsule.id !== nearestCapsule.id) {
                                activeCapsule = nearestCapsule;
                                document.getElementById('discovery-title').innerText = `⏳ ${nearestCapsule.title}`;
                                document.getElementById('discovery-desc').innerText = nearestCapsule.desc;
                                document.getElementById('discovery-modal').style.display = 'block';
                            }
                        } else if (minDistance <= 100) {
                            banner.innerText = `✨ 근처에 타임캡슐(${nearestCapsule.title})이 있습니다! (${Math.round(minDistance)}m)`;
                        } else {
                            banner.innerText = `가장 가까운 타임캡슐까지 거리: 약 ${Math.round(minDistance)}m`;
                        }
                    }
                },
                function(error) { 
                    console.error("GPS 오류", error);
                    document.getElementById('guide-banner').innerText = "⚠️ GPS 위치를 가져올 수 없습니다.";
                },
                { enableHighAccuracy: true }
            );
        }

        map.on('click', function(e) {
            if (isBulkFilmMode) {
                db.collection("admin_films").add({
                    lat: e.latlng.lat,
                    lon: e.latlng.lng
                });
                return;
            }

            if (isPickingMode) {
                pickedLat = e.latlng.lat;
                pickedLon = e.latlng.lng;

                if (tempPickMarker) {
                    map.removeLayer(tempPickMarker);
                }
                let pickIcon = L.divIcon({
                    className: 'custom-pick',
                    html: `
                        <div style="position:relative; width:30px; height:38px;">
                            <div style="width:30px; height:30px; background:#ff5722; border-radius:50% 50% 50% 0; transform:rotate(-45deg); position:absolute; top:0; left:0; border:2px solid white; box-shadow:0 3px 6px rgba(255,87,34,0.8);"></div>
                            <div style="position:absolute; top:0; left:0; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:white; font-size:12px; font-weight:bold;">📍</div>
                        </div>
                    `,
                    iconSize: [30, 38],
                    iconAnchor: [15, 38]
                });
                tempPickMarker = L.marker([pickedLat, pickedLon], {icon: pickIcon}).addTo(map);

                document.getElementById('selected-coords-text').innerText = `선택된 위치: 위도 ${pickedLat.toFixed(4)}, 경도 ${pickedLon.toFixed(4)}`;
                isPickingMode = false;
                document.getElementById('admin-modal').style.display = 'block';
                alert("📍 위치가 지정되었습니다!");
            }
        });

        function startPickingLocation() {
            isPickingMode = true;
            document.getElementById('admin-modal').style.display = 'none';
            alert("🗺️ 지도를 터치하여 타임캡슐을 배치할 장소를 선택해주세요!");
        }

        function toggleBulkFilmMode() {
            isBulkFilmMode = !isBulkFilmMode;
            let btn = document.getElementById('admin-bulk-btn');
            if (isBulkFilmMode) {
                btn.innerText = "필름 연속 배치: ON ✨";
                btn.className = "action-btn bulk-btn active";
                alert("✨ 필름 연속 배치 모드가 켜졌습니다! 이제 지도를 클릭하는 곳마다 미니 필름이 바로 생성됩니다.");
            } else {
                btn.innerText = "필름 연속 배치: OFF";
                btn.className = "action-btn bulk-btn";
                alert("필름 연속 배치 모드가 꺼졌습니다.");
            }
        }

        function startMission() {
            if (userFilms < 10) {
                alert("빛바랜 필름이 부족합니다! (필요: 10개)");
                return;
            }
            userFilms -= 10;
            document.getElementById('film-count').innerText = userFilms;
            saveUserData();
            
            currentMissionCapsule = activeCapsule;
            closeModal('discovery-modal');
            
            document.getElementById('target-photo').src = currentMissionCapsule.url;
            document.getElementById('target-photo').style.filter = 'blur(5px)';
            document.getElementById('overlay-text').style.display = 'flex';
            document.getElementById('complete-btn').disabled = true;
            document.getElementById('complete-btn').className = 'btn btn-secondary';

            document.getElementById('mission-modal').style.display = 'block';
        }

        function wipeDust() {
            document.getElementById('target-photo').style.filter = 'blur(0px)';
            document.getElementById('overlay-text').style.display = 'none';
            
            let btn = document.getElementById('complete-btn');
            btn.disabled = false;
            btn.className = 'btn';
        }

        function savePhoto() {
            if (!currentMissionCapsule) {
                alert("타임캡슐 정보를 찾을 수 없습니다. 다시 시도해주세요.");
                closeModal('mission-modal');
                return;
            }

            let photoData = {
                id: currentMissionCapsule.id,
                title: currentMissionCapsule.title,
                region: currentMissionCapsule.region || "기타",
                date: new Date().toLocaleDateString(),
                url: currentMissionCapsule.url,
                desc: currentMissionCapsule.desc
            };

            try {
                let album = getAlbum();
                if (!album.some(item => item.id === photoData.id)) {
                    album.push(photoData);
                    localStorage.setItem('gwangmyeong_album', JSON.stringify(album));
                    alert("🎉 성공적으로 사진을 도감에 수집했습니다!");
                    renderMarkers();
                } else {
                    alert("이미 도감에 등록된 사진입니다!");
                }
            } catch (err) {
                console.error(err);
                alert("도감 저장 중 오류가 발생했습니다.");
            }

            closeModal('mission-modal');
        }

        function openAdminModal() {
            let center = map.getCenter();
            if (pickedLat === null || pickedLon === null) {
                pickedLat = center.lat;
                pickedLon = center.lng;
            }
            document.getElementById('selected-coords-text').innerText = `📍 현재 지도 중심 위치 (위도 ${pickedLat.toFixed(4)}, 경도 ${pickedLon.toFixed(4)})`;
            document.getElementById('admin-modal').style.display = 'block';
        }

        function openAdminListModal() {
            renderAdminList();
            document.getElementById('admin-list-modal').style.display = 'block';
        }

        function renderAdminList() {
            let listDiv = document.getElementById('admin-capsule-list');
            listDiv.innerHTML = "";
            let capsules = getCapsules();

            if (capsules.length === 0) {
                listDiv.innerHTML = "<p style='color:#888; font-size:11px; text-align:center;'>등록된 캡슐이 없습니다.</p>";
            } else {
                capsules.forEach((cap) => {
                    listDiv.innerHTML += `
                        <div class="list-item">
                            <img src="${cap.url}" alt="미리보기">
                            <div style="flex-grow:1; margin-left:6px; overflow:hidden;">
                                <div style="font-weight:bold; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">[${cap.region || '기타'}] ${cap.title}</div>
                            </div>
                            <button class="btn btn-edit" onclick="closeModal('admin-list-modal'); editCapsule('${cap.id}')">수정</button>
                            <button class="btn btn-danger" onclick="deleteCapsule('${cap.id}')">삭제</button>
                        </div>
                    `;
                });
            }
        }

        function editCapsule(id) {
            let capsules = getCapsules();
            let cap = capsules.find(c => c.id === id);
            if (!cap) return;

            document.getElementById('edit-capsule-id').value = cap.id;
            document.getElementById('admin-title').value = cap.title;
            document.getElementById('admin-region').value = cap.region || "광명동";
            document.getElementById('admin-url').value = cap.url;
            document.getElementById('admin-desc').value = cap.desc;
            
            pickedLat = cap.lat;
            pickedLon = cap.lon;
            document.getElementById('selected-coords-text').innerText = `선택된 위치: 위도 ${pickedLat.toFixed(4)}, 경도 ${pickedLon.toFixed(4)}`;

            document.getElementById('admin-modal-title').innerText = "🛠️ 타임캡슐 수정";
            document.getElementById('admin-submit-btn').innerText = "💾 타임캡슐 수정 완료";
            document.getElementById('admin-cancel-edit-btn').style.display = 'block';
            
            document.getElementById('admin-modal').style.display = 'block';
        }

        function resetAdminForm() {
            document.getElementById('edit-capsule-id').value = "";
            document.getElementById('admin-title').value = "";
            document.getElementById('admin-region').value = "광명동";
            document.getElementById('admin-desc').value = "";
            document.getElementById('admin-file').value = "";
            document.getElementById('admin-url').value = "";
            
            let center = map.getCenter();
            pickedLat = center.lat;
            pickedLon = center.lng;
            document.getElementById('selected-coords-text').innerText = `📍 현재 지도 중심 위치로 자동 지정됨`;

            if (tempPickMarker) {
                map.removeLayer(tempPickMarker);
                tempPickMarker = null;
            }

            document.getElementById('admin-modal-title').innerText = "🛠️ 타임캡슐 등록";
            document.getElementById('admin-submit-btn').innerText = "✨ 타임캡슐 등록하기";
            document.getElementById('admin-cancel-edit-btn').style.display = 'none';
        }

        function processAndSaveCapsule() {
            let editId = document.getElementById('edit-capsule-id').value;
            let title = document.getElementById('admin-title').value.trim();
            let region = document.getElementById('admin-region').value.trim() || "광명동";
            let desc = document.getElementById('admin-desc').value.trim();
            let urlInput = document.getElementById('admin-url').value.trim();
            let fileInput = document.getElementById('admin-file');

            if (!title) {
                alert("타임캡슐 제목을 입력해주세요!");
                return;
            }
            if (pickedLat === null || pickedLon === null) {
                let center = map.getCenter();
                pickedLat = center.lat;
                pickedLon = center.lng;
            }

            if (fileInput.files && fileInput.files[0]) {
                let file = fileInput.files[0];
                let reader = new FileReader();

                reader.onload = function(e) {
                    let img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        let canvas = document.createElement('canvas');
                        let max_size = 300;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > max_size) { height *= max_size / width; width = max_size; }
                        } else {
                            if (height > max_size) { width *= max_size / height; height = max_size; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        let ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        let compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        saveCapsuleData(editId, title, region, desc, compressedDataUrl, pickedLat, pickedLon);
                    };
                };
                reader.readAsDataURL(file);
            } else if (urlInput) {
                saveCapsuleData(editId, title, region, desc, urlInput, pickedLat, pickedLon);
            } else {
                alert("사진 파일을 선택하거나 이미지 URL을 입력해주세요!");
            }
        }

        function saveCapsuleData(editId, title, region, desc, imageUrl, lat, lon) {
            let capsuleData = {
                title: title,
                region: region,
                lat: lat,
                lon: lon,
                url: imageUrl,
                desc: desc || "역사 타임캡슐입니다."
            };

            let promise;
            if (editId) {
                promise = db.collection("capsules").doc(editId).set(capsuleData);
            } else {
                promise = db.collection("capsules").add(capsuleData);
            }

            promise.then(() => {
                alert(editId ? "✨ 타임캡슐이 성공적으로 수정되었습니다!" : "✨ 새로운 타임캡슐이 성공적으로 등록되었습니다!");
                resetAdminForm();
                closeModal('admin-modal');
            }).catch((error) => {
                alert("저장 중 오류가 발생했습니다: " + error.message);
            });
        }

        function deleteCapsule(id) {
            if (confirm("정말 이 타임캡슐을 삭제하시겠습니까?")) {
                db.collection("capsules").doc(id).delete().then(() => {
                    renderAdminList();
                    alert("삭제되었습니다.");
                });
            }
        }

        function openAlbum() {
            let album = getAlbum();
            let count = album.length;

            let titleStr = "초보 탐험가";
            if (count >= 100) titleStr = "전설의 광명 사학자 🏆";
            else if (count >= 75) titleStr = "역사 복원 마스터";
            else if (count >= 40) titleStr = "베테랑 탐험가";
            else if (count >= 10) titleStr = "기록 수집가";

            document.getElementById('current-region-title').innerText = `${titleStr} (${count}/100)`;

            let gridContainer = document.getElementById('slots-grid-container');
            gridContainer.innerHTML = "";

            for (let i = 0; i < 100; i++) {
                let slotDiv = document.createElement('div');
                slotDiv.className = "photo-slot";

                if (i < album.length) {
                    let collectedItem = album[i];
                    slotDiv.className += " filled";
                    slotDiv.innerHTML = `<img src="${collectedItem.url}" alt="${collectedItem.title}">`;
                    slotDiv.onclick = () => openPhotoDetail(collectedItem.title, collectedItem.url, collectedItem.desc, collectedItem.date);
                } else {
                    slotDiv.innerHTML = `<span>🔒</span>`;
                }
                gridContainer.appendChild(slotDiv);
            }

            document.getElementById('album-modal').style.display = 'block';
        }

        function openPhotoDetail(title, url, desc, date) {
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-img').src = url;
            document.getElementById('detail-img').style.transform = "scale(1)";
            document.getElementById('detail-desc').innerText = desc;
            document.getElementById('detail-date').innerText = "획득일: " + date;
            
            document.getElementById('album-modal').style.display = 'none';
            document.getElementById('photo-detail-modal').style.display = 'block';
        }

        function toggleZoomImage(imgElement) {
            if (imgElement.style.transform === "scale(2)") {
                imgElement.style.transform = "scale(1)";
            } else {
                imgElement.style.transform = "scale(2)";
            }
        }

        function downloadPhoto() {
            let imgUrl = document.getElementById('detail-img').src;
            let title = document.getElementById('detail-title').innerText || "타임캡슐_사진";
            
            let a = document.createElement('a');
            a.href = imgUrl;
            a.download = title + ".jpg";
            a.target = "_blank";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if(modalId === 'admin-modal') {
                resetAdminForm();
            }
            if(modalId === 'photo-detail-modal') {
                openAlbum();
            }
        }
    </script>
</body>
</html>
