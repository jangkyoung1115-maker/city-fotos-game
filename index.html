<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>광명시 시간캡슐 — 3D 지도 시안</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--navy:rgba(4,20,38,.88);--line:#8edfff;--cyan:#69dcff}
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;background:#061b2c;font-family:Arial,"Noto Sans KR",sans-serif}
#map{position:absolute;inset:0}
.maplibregl-canvas{filter:grayscale(.2) sepia(.22) hue-rotate(158deg) saturate(1.55) brightness(.82) contrast(1.12)}
.maplibregl-ctrl-group{background:#09243b!important;border:1px solid #6abfe8!important}
.maplibregl-ctrl button{filter:invert(1)}
.brand{position:absolute;z-index:5;top:18px;left:20px;color:#f3fbff;text-shadow:0 2px 8px #001;pointer-events:none}
.brand b{display:block;font-size:20px}.brand small{color:#b9eaff}
.status{position:absolute;z-index:5;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;padding:12px 18px;border:1px solid #8edfff88;border-radius:18px;background:var(--navy);color:#eaf8ff;box-shadow:0 8px 28px #0019;white-space:nowrap}
.status strong{color:#8fe6ff;font-size:18px}
.guide{position:absolute;z-index:5;left:16px;bottom:20px;width:290px;padding:16px;border:1px solid #8edfff88;border-radius:17px;background:var(--navy);color:#eaf8ff;box-shadow:0 8px 28px #0019}
.guide h3{margin:6px 0 12px}.guide p{font-size:12px;color:#b9d6e8;line-height:1.6}
.close{position:absolute;right:8px;top:8px;border:1px solid #8edfff88;border-radius:50%;width:28px;height:28px;color:white;background:#09243b;font-size:18px;cursor:pointer}
.reopen{display:none;position:absolute;z-index:5;left:16px;bottom:20px;padding:10px 14px;color:white;background:var(--navy);border:1px solid #8edfff;border-radius:12px}
.legend{position:absolute;right:18px;bottom:20px;z-index:5;color:#dff7ff;background:var(--navy);border:1px solid #8edfff88;border-radius:14px;padding:12px 15px;font-size:12px}
.gem{width:22px;height:42px;object-fit:contain;filter:drop-shadow(0 0 9px #62cfff)}
.shard{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 8px #4bcaff)}
.maplibregl-marker{cursor:pointer}
.note{position:absolute;z-index:5;top:78px;right:16px;max-width:300px;padding:9px 12px;color:#d8f3ff;background:#061b2ccc;border:1px solid #62cfff66;border-radius:10px;font-size:11px}
@media(max-width:650px){.brand{top:10px;left:10px}.brand b{font-size:15px}.status{top:58px;gap:8px;padding:8px 10px;font-size:11px}.status strong{font-size:14px}.guide{left:10px;bottom:12px;width:calc(100% - 20px);padding:12px}.legend{display:none}.note{top:108px;right:8px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="brand"><b>광명의 시간캡슐</b><small>도시의 기억을 수집하는 필름 탐험</small></div>
<div class="status">✦ 파편 <strong id="fragments">0/5</strong>　▱ 완성 필름 <strong id="films">15</strong></div>
<div class="guide" id="guide">
<button class="close" onclick="document.getElementById('guide').style.display='none';document.getElementById('reopen').style.display='block'">×</button>
<small style="letter-spacing:.16em;color:#82dcff">COLLECTION GUIDE</small>
<h3>기억을 모으는 방법</h3>
<p>✦ 필름 파편 <b>5개</b>　→　완성 필름 <b>1개</b></p>
<p>▤ 완성 필름 <b>10개</b>　→　타임캡슐 <b>1개</b></p>
<p>이 화면은 실제 3D 지도 엔진과 건물 입체화를 확인하는 별도 시안입니다.</p>
</div>
<button class="reopen" id="reopen" onclick="document.getElementById('guide').style.display='block';this.style.display='none'">수집 안내</button>
<div class="legend">TIME CAPSULES　💎 현대　💠 중간 시대　▤ 오래된 기억</div>
<div class="note">3D 사선 지도 시안 · 지도 회전/기울기 가능</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
            apiKey: "AIzaSyAjH7abrM1-0a7OG1KdSsIlIAJmR_b3ypw",
            authDomain: "time-capsule-e8725.firebaseapp.com",
            projectId: "time-capsule-e8725",
            storageBucket: "time-capsule-e8725.firebasestorage.app",
            messagingSenderId: "1021563795745",
            appId: "1:1021563795745:web:6d5733948d3363f696a660"
        };
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/liberty',
 center:[126.8646,37.4784],
 zoom:15.2,
 pitch:62,
 bearing:-22,
 maxPitch:70,
 minZoom:12,
 maxZoom:19,
 antialias:true
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
const capsuleMarkers=[];
const filmMarkers=[];
function iconMarker(url,kind,alt){
 const el=document.createElement('div');
 const img=document.createElement('img');
 img.src=url;img.alt=alt;
 img.className=kind==='capsule'?'gem':'shard';
 el.appendChild(img);
 return el;
}
function addCapsule(cap){
 const type=cap.capsuleType||'modern';
 const file=type==='mid-era'?'02_mid-era':type==='old'?'03_old':type==='ancient'?'04_ancient':'01_modern';
 const url=`assets/capsule/capsule_${file}.png`;
 const marker=new maplibregl.Marker({element:iconMarker(url,'capsule','크리스털 타임캡슐'),anchor:'bottom'})
 .setLngLat([cap.lon,cap.lat]).setPopup(new maplibregl.Popup({offset:24}).setHTML(`<b>${cap.title||'타임캡슐'}</b><br>${cap.region||''}<br>${cap.photoYear||''}`)).addTo(map);
 capsuleMarkers.push(marker);
}
function addFilm(film){
 const n=String(film.id||'film').split('').reduce((a,c,i)=>(a+c.charCodeAt(0)*(i+1))%997,0)%18+1;
 const url=`assets/film/film_fragment_${String(n).padStart(2,'0')}.png`;
 const marker=new maplibregl.Marker({element:iconMarker(url,'film','크리스털 필름 파편')})
 .setLngLat([film.lon,film.lat]).setPopup(new maplibregl.Popup({offset:18}).setText('크리스털 필름 파편')).addTo(map);
 filmMarkers.push(marker);
}
function add3DBuildings(){
 const layers=map.getStyle().layers||[];
 const label=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);
 const before=label?label.id:undefined;
 if(!map.getLayer('gwangmyeong-3d-buildings')){
  map.addLayer({id:'gwangmyeong-3d-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',
   minzoom:14,
   filter:['!=',['get','hide_3d'],true],
   paint:{
    'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],['get','height'],8],0,'#183d58',30,'#287ba0',80,'#63c8e9'],
    'fill-extrusion-height':['interpolate',['linear'],['zoom'],14,0,['coalesce',['get','render_height'],['get','height'],8]],
    'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],
    'fill-extrusion-opacity':0.82
   }},before);
 }
}
map.on('load',()=>{
 add3DBuildings();
 map.setFog({color:'rgb(5,24,42)','high-color':'rgb(15,75,112)','space-color':'rgb(2,12,25)','horizon-blend':0.08});
});
db.collection('capsules').onSnapshot(snap=>{
 capsuleMarkers.forEach(m=>m.remove());capsuleMarkers.length=0;
 snap.forEach(doc=>{const d=doc.data();addCapsule(d)});
});
db.collection('admin_films').onSnapshot(snap=>{
 filmMarkers.forEach(m=>m.remove());filmMarkers.length=0;
 snap.forEach(doc=>{const d=doc.data();d.id=doc.id;addFilm(d)});
});
if(navigator.geolocation){
 navigator.geolocation.watchPosition(pos=>{
  const p=[pos.coords.longitude,pos.coords.latitude];
  if(!window.userPin){
   const el=document.createElement('div');el.style.cssText='width:16px;height:16px;border-radius:50%;background:#31e477;border:3px solid white;box-shadow:0 0 14px #31e477';
   window.userPin=new maplibregl.Marker({element:el}).setLngLat(p).addTo(map);
   map.flyTo({center:p,zoom:16,pitch:62,duration:1600});
  }else window.userPin.setLngLat(p);
 },err=>console.warn('GPS',err),{enableHighAccuracy:true});
}
</script>
</body>
</html>
